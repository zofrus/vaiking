# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-vaiking
resources:
  - deployment.yaml
  - reconciler.yaml
  - service.yaml
  - httproute.yaml
  - pdb.yaml
images:
  - name: app
    newName: ghcr.io/zofrus/vaiking
    newTag: "c48e246"
