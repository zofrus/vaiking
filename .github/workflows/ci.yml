name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web/package-lock.json
      - name: Install app
        run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Install web
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Lint app
        run: npm run lint
        working-directory: app
      - name: Lint web
        run: npm run lint
        working-directory: web
      - name: Test app
        run: npm test
        working-directory: app
      - name: Build web
        run: npm run build
        working-directory: web
