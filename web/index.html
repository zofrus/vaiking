<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Rollout guard. While old and new pods both serve, this page can name a built file
         (/assets/...) that the other pod does not have, and the app never starts. Reload
         after 1.5 s, at most twice in 2 minutes per tab, so it can never loop. Plain ES5
         and inline on purpose: it has to work when the app's own script fails to load. -->
    <script>
      (function () {
        var KEY = "grace-asset-reloads-v1", WINDOW_MS = 120000, MAX = 2, scheduled = false;
        window.addEventListener("error", function (e) {
          var el = e.target, tag = el && el.tagName, url = tag === "SCRIPT" ? el.src : tag === "LINK" ? el.href : "";
          if (scheduled || typeof url !== "string" || url.indexOf("/assets/") === -1) return;
          try {
            var now = Date.now(), recent = [], seen = JSON.parse(sessionStorage.getItem(KEY) || "[]");
            if (!Array.isArray(seen)) seen = [];
            for (var i = 0; i < seen.length; i++) {
              if (typeof seen[i] === "number" && seen[i] <= now && now - seen[i] < WINDOW_MS) recent.push(seen[i]);
            }
            if (recent.length >= MAX) return;
            recent.push(now);
            sessionStorage.setItem(KEY, JSON.stringify(recent));
          } catch (err) {
            return; // no storage means no guard against a loop: do not reload
          }
          scheduled = true;
          setTimeout(function () { location.reload(); }, 1500);
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grace Period</title>
    <meta name="description" content="The button for when you need to leave a talk. A quiet room, a card for staff and your day plan, one tap away." />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181B" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Grace" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grace Period" />
    <meta property="og:title" content="Grace Period" />
    <meta property="og:description" content="The button for when you need to leave a talk." />
    <meta property="og:image" content="https://grace.effulgentpoint.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Grace Period: the button for when you need to leave a talk" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- With viewport-fit=cover the page reaches the screen edges: keep content out of notches and the home bar. -->
    <style>
      #root { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
